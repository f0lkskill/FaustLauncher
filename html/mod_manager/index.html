<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mod管理器</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    }

    body {
        background: radial-gradient(120% 90% at 50% 30%, #04060c 0%, #010102 100%);
        color: #d3d3d3;
    }

    #bgimg {
        position: fixed;
        right: -40px;
        bottom: -40px;
        width: min(30vw, 240px);
        opacity: 0.08;
        pointer-events: none;
        object-fit: contain;
        filter: drop-shadow(0 0 60px rgba(90, 160, 255, 0.25));
    }

    .wrap {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        padding: 22px 30px 20px;
    }

    /* ── 拖拽区域 ── */
    .dropzone {
        margin-top: 12px;
        padding: 18px 20px;
        border: 1.5px dashed rgba(148, 163, 184, 0.35);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.02);
        text-align: center;
        cursor: pointer;
        transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }

    .dropzone:hover {
        border-color: rgba(88, 166, 255, 0.6);
        background: rgba(88, 166, 255, 0.04);
    }

    .dropzone.drag {
        border-color: #10b981;
        background: rgba(16, 185, 129, 0.1);
        box-shadow: 0 0 24px rgba(16, 185, 129, 0.25);
    }

    .dropzone .dz-title {
        font-size: 14px;
        font-weight: bold;
        color: #e2e8f0;
        letter-spacing: 1px;
    }

    .dropzone .dz-hint {
        margin-top: 6px;
        font-size: 12px;
        color: #94a3b8;
    }

    .dropzone .dz-hint b {
        color: #f87171;
        font-weight: bold;
    }

    /* ── 文件列表 ── */
    .list {
        flex: 1;
        overflow-y: auto;
        margin-top: 12px;
        padding: 4px;
    }

    .list::-webkit-scrollbar {
        width: 10px;
    }
    .list::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.5);
        border-radius: 5px;
    }
    .list::-webkit-scrollbar-thumb:hover {
        background: rgba(148, 163, 184, 0.75);
    }
    .list::-webkit-scrollbar-track {
        background: rgba(148, 163, 184, 0.08);
        border-radius: 5px;
    }

    .list .empty {
        margin-top: 40px;
        text-align: center;
        color: #64748b;
        font-size: 13px;
    }

    .row {
        display: grid;
        grid-template-columns: 30px minmax(0, 1fr) auto 64px auto;
        align-items: center;
        gap: 12px;
        padding: 9px 14px;
        margin-bottom: 6px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(148, 163, 184, 0.14);
        border-radius: 10px;
        transition: background 0.15s ease, border-color 0.15s ease;
    }

    .row:hover {
        background: rgba(255, 255, 255, 0.05);
        border-color: rgba(148, 163, 184, 0.3);
    }

    .row.off {
        opacity: 0.55;
    }

    .row .ficon {
        font-size: 20px;
        width: 30px;
        text-align: center;
        flex-shrink: 0;
    }

    .row .fname {
        min-width: 0;
        font-size: 13px;
        font-weight: bold;
        color: #e2e8f0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        user-select: text;
    }

    .row .fname .fext {
        color: #64748b;
        font-weight: normal;
    }

    .row .finfo {
        justify-self: end;
        text-align: right;
        font-size: 11.5px;
        color: #94a3b8;
        line-height: 1.5;
        white-space: nowrap;
    }

    .row .status {
        justify-self: end;
        font-size: 12px;
        font-weight: bold;
    }

    .row .status.on { color: #2ecc71; }
    .row .status.off { color: #e74c3c; }

    .row .ops {
        justify-self: end;
        display: flex;
        gap: 6px;
    }

    .mini-btn {
        border: 1px solid rgba(148, 163, 184, 0.25);
        background: rgba(255, 255, 255, 0.04);
        color: #cbd5e1;
        font-family: inherit;
        font-size: 12px;
        padding: 5px 12px;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .mini-btn:hover { background: rgba(255, 255, 255, 0.1); }

    .mini-btn.on {
        border-color: rgba(16, 185, 129, 0.55);
        background: rgba(16, 185, 129, 0.12);
        color: #34d399;
    }
    .mini-btn.on:hover { background: rgba(16, 185, 129, 0.22); }

    .mini-btn.off {
        border-color: rgba(239, 68, 68, 0.45);
        background: rgba(239, 68, 68, 0.1);
        color: #f87171;
    }
    .mini-btn.off:hover { background: rgba(239, 68, 68, 0.2); }

    .mini-btn.del { color: #f87171; border-color: rgba(239, 68, 68, 0.3); }
    .mini-btn.del:hover { background: rgba(239, 68, 68, 0.15); }

    .mini-btn.info { color: #38bdf8; border-color: rgba(56, 189, 248, 0.35); }
    .mini-btn.info:hover { background: rgba(56, 189, 248, 0.15); }

    /* ── 信息弹窗 ── */
    #infoModal {
        position: fixed;
        inset: 0;
        background: rgba(2, 4, 10, 0.72);
        backdrop-filter: blur(3px);
        display: none;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.18s ease;
        z-index: 1001;
    }

    #infoModal.show {
        display: flex;
        opacity: 1;
    }

    @keyframes modalIn {
        from {
            transform: translateY(16px) scale(0.94);
            opacity: 0;
        }
        to {
            transform: translateY(0) scale(1);
            opacity: 1;
        }
    }

    #infoModal .modal-box {
        width: min(560px, 88vw);
        max-height: 74vh;
        display: flex;
        flex-direction: column;
        background: #0b1426;
        border: 1px solid rgba(56, 189, 248, 0.3);
        border-radius: 12px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
        transform-origin: center;
        animation: modalIn 0.24s cubic-bezier(0.2, 0.9, 0.3, 1.12) both;
    }

    #infoModal .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 18px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.15);
        font-size: 14px;
        font-weight: bold;
        color: #e2e8f0;
    }

    #infoModal .modal-head .close-x {
        background: none;
        border: none;
        color: #94a3b8;
        font-size: 16px;
        cursor: pointer;
        padding: 2px 6px;
    }

    #infoModal .modal-head .close-x:hover { color: #f87171; }

    #infoModal .modal-body {
        padding: 14px 18px;
        overflow-y: auto;
        font-size: 12.5px;
        color: #cbd5e1;
        line-height: 1.7;
        white-space: pre-wrap;
        word-break: break-all;
        user-select: text;
    }

    #infoModal .modal-body::-webkit-scrollbar { width: 8px; }
    #infoModal .modal-body::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.45); border-radius: 4px; }

    /* ── 状态栏 ── */
    .statusbar {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid rgba(148, 163, 184, 0.15);
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        color: #94a3b8;
    }

    .statusbar .msg {
        color: #34d399;
        max-width: 380px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .statusbar .msg.err { color: #f87171; }

    /* ── 拖拽覆盖层 ── */
    #dropOverlay {
        position: fixed;
        inset: 0;
        background: rgba(4, 6, 12, 0.85);
        backdrop-filter: blur(2px);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 999;
        border: 2.5px dashed #10b981;
        border-radius: 14px;
        margin: 14px;
        pointer-events: none;
    }

    #dropOverlay.show { display: flex; }

    #dropOverlay .ov-inner {
        text-align: center;
        color: #34d399;
    }

    #dropOverlay .ov-icon { font-size: 44px; }
    #dropOverlay .ov-text { margin-top: 10px; font-size: 16px; font-weight: bold; letter-spacing: 2px; }
    #dropOverlay .ov-sub { margin-top: 6px; font-size: 12.5px; color: #94a3b8; }

    .toast {
        position: fixed;
        bottom: 56px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(16, 185, 129, 0.15);
        border: 1px solid rgba(16, 185, 129, 0.5);
        color: #34d399;
        font-size: 12.5px;
        padding: 8px 20px;
        border-radius: 999px;
        opacity: 0;
        transition: opacity 0.2s ease;
        pointer-events: none;
        z-index: 1000;
    }

    .toast.err {
        background: rgba(239, 68, 68, 0.15);
        border-color: rgba(239, 68, 68, 0.5);
        color: #f87171;
    }

    .toast.show { opacity: 1; }
</style>
</head>
<body>
<img id="bgimg" alt="">
<div class="wrap">
    <div class="dropzone" id="dropzone">
        <div class="dz-title">📁 拖拽 Mod 文件到此处</div>
        <div class="dz-hint">支持批量添加 · 仅支持单文件 <b>.bank</b>（音效）、<b>.carra2</b>（贴图）与 <b>.rebank</b>（差分）· 或点击选择文件</div>
    </div>

    <div class="list" id="list">
        <div class="empty">加载中...</div>
    </div>

    <div class="statusbar">
        <span id="count">已加载 0 个文件</span>
        <span class="msg" id="msg"></span>
    </div>
</div>

<div id="dropOverlay">
    <div class="ov-inner">
        <div class="ov-icon">📥</div>
        <div class="ov-text">松开以添加文件</div>
        <div class="ov-sub">仅支持 .bank / .carra2 / .rebank 单文件，支持批量</div>
    </div>
</div>

<div class="toast" id="toast"></div>

<div id="infoModal">
    <div class="modal-box">
        <div class="modal-head">
            <span id="infoTitle">🧩 rebank 差分信息</span>
            <button class="close-x" id="infoClose">✕</button>
        </div>
        <div class="modal-body" id="infoBody"></div>
    </div>
</div>

<script>
    "use strict";

    const $ = (id) => document.getElementById(id);
    let api = null;

    let toastTimer = null;
    function showToast(text, isErr) {
        const t = $("toast");
        t.textContent = text;
        t.className = "toast" + (isErr ? " err show" : " show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { t.className = "toast" + (isErr ? " err" : ""); }, 2600);
    }

    function fmtSize(bytes) {
        if (bytes < 1024) return bytes + " B";
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
        return (bytes / (1024 * 1024)).toFixed(1) + " MB";
    }

    function renderFiles(d) {
        const list = $("list");
        list.innerHTML = "";
        const files = d.files || [];
        if (!files.length) {
            list.innerHTML = '<div class="empty">📭 暂无 Mod 文件，拖拽或点击上方区域添加</div>';
        }
        files.forEach((f) => {
            const row = document.createElement("div");
            row.className = "row" + (f.enabled ? "" : " off");

            const icon = document.createElement("span");
            icon.className = "ficon";
            icon.textContent = f.icon;

            const name = document.createElement("span");
            name.className = "fname";
            const ns = document.createElement("span");
            ns.textContent = f.name;
            const ext = document.createElement("span");
            ext.className = "fext";
            ext.textContent = f.ext;
            name.appendChild(ns);
            name.appendChild(ext);

            const info = document.createElement("span");
            info.className = "finfo";
            info.textContent = f.type_label + " · " + f.size;

            const status = document.createElement("span");
            status.className = "status " + (f.enabled ? "on" : "off");
            status.textContent = f.enabled ? "● 已启用" : "● 已禁用";

            const ops = document.createElement("span");
            ops.className = "ops";

            const toggle = document.createElement("button");
            toggle.className = "mini-btn " + (f.enabled ? "off" : "on");
            toggle.textContent = f.enabled ? "⛔ 禁用" : "✓ 启用";
            toggle.onclick = async () => {
                try {
                    const r = await api.toggle(f.raw_name);
                    if (r && r.error) { setMsg(r.error, true); return; }
                    setMsg(f.enabled ? "已禁用 " + f.name : "已启用 " + f.name);
                    loadList();
                } catch (e) {
                    setMsg("操作失败: " + e, true);
                }
            };

            const open = document.createElement("button");
            open.className = "mini-btn";
            open.textContent = "📂";
            open.title = "在资源管理器中显示";
            open.onclick = () => api.open_file(f.raw_name);

            const del = document.createElement("button");
            del.className = "mini-btn del";
            del.textContent = "🗑️";
            del.title = "删除文件";
            del.onclick = async () => {
                try {
                    const ok = await api.confirm_delete(f.name);
                    if (!ok) return;
                    const r = await api.delete_file(f.raw_name);
                    if (r && r.error) { setMsg(r.error, true); return; }
                    setMsg("已删除 " + f.name);
                    loadList();
                } catch (e) {
                    setMsg("删除失败: " + e, true);
                }
            };

            ops.appendChild(toggle);
            if (f.ext === ".rebank") {
                const info = document.createElement("button");
                info.className = "mini-btn info";
                info.textContent = "ℹ️";
                info.title = "查看差分信息";
                info.onclick = () => showRebankInfo(f.raw_name);
                ops.appendChild(info);
            }
            ops.appendChild(open);
            ops.appendChild(del);

            row.appendChild(icon);
            row.appendChild(name);
            row.appendChild(info);
            row.appendChild(status);
            row.appendChild(ops);

            list.appendChild(row);
        });

        const enabledCount = files.filter((f) => f.enabled).length;
        $("count").textContent = "已加载 " + files.length + " 个文件 · " + enabledCount + " 已启用";
    }

    function setMsg(text, isErr) {
        const m = $("msg");
        m.textContent = text || "";
        m.className = "msg" + (isErr ? " err" : "");
    }

    function showModal(text) {
        const m = $("infoModal");
        $("infoBody").textContent = text;
        const box = m.querySelector(".modal-box");
        box.style.animation = "none";          // 重触发入场动画
        void box.offsetWidth;
        box.style.animation = "";
        m.style.display = "flex";
        m.classList.add("show");
    }

    function hideModal() {
        const m = $("infoModal");
        if (!m.classList.contains("show") && m._hiding) return;
        if (m._hiding) return;
        m._hiding = true;
        m.classList.remove("show");
        setTimeout(() => {
            m.style.display = "none";
            m._hiding = false;
        }, 190);
    }

    async function showRebankInfo(rawName) {
        try {
            const r = await api.rebank_info(rawName);
            if (r && r.error) { setMsg(r.error, true); return; }
            showModal(r && r.text ? r.text : "(无输出)");
        } catch (e) {
            setMsg("查看信息失败: " + (e && (e.message || e) || e), true);
        }
    }

    $("infoClose").addEventListener("click", hideModal);
    $("infoModal").addEventListener("click", (e) => {
        if (e.target === $("infoModal")) hideModal();
    });
    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") hideModal();
    });

    async function loadList() {
        try {
            const d = await api.get_data();
            renderFiles(d);
        } catch (e) {
            console.error(e);
            setMsg("获取列表失败: " + (e && (e.message || e) || e), true);
        }
    }

    function handleAdd(results) {
        const okCount = results.filter((r) => r.ok).length;
        const failCount = results.length - okCount;
        if (okCount > 0) {
            setMsg("已添加 " + okCount + " 个文件" + (failCount > 0 ? "，" + failCount + " 个被拒绝" : ""));
            if (failCount > 0) showToast(failCount + " 个文件不符合要求（仅支持 .bank / .carra2 / .rebank）", true);
            loadList();
        } else if (failCount > 0) {
            setMsg("没有可添加的文件（仅支持 .bank / .carra2 / .rebank）", true);
            showToast("仅支持 .bank / .carra2 / .rebank 单文件", true);
        } else {
            setMsg("未选择文件");
        }
    }

    async function pickFiles() {
        try {
            const results = await api.pick_files();
            handleAdd(results);
        } catch (e) {
            setMsg("添加失败: " + (e && (e.message || e) || e), true);
        }
    }

    // 拖拽视觉反馈 (实际文件处理在 Python 侧 pywebview DOM drop 事件)
    const dz = $("dropzone");
    let dragDepth = 0;

    function dragEnter(e) {
        e.preventDefault();
        dragDepth++;
        dz.classList.add("drag");
        $("dropOverlay").classList.add("show");
    }

    function dragOver(e) {
        e.preventDefault();
    }

    function dragLeave(e) {
        e.preventDefault();
        dragDepth--;
        if (dragDepth <= 0) {
            dragDepth = 0;
            dz.classList.remove("drag");
            $("dropOverlay").classList.remove("show");
        }
    }

    function drop(e) {
        e.preventDefault();
        dragDepth = 0;
        dz.classList.remove("drag");
        $("dropOverlay").classList.remove("show");
        // 实际文件路径由 pywebview 的 DOM drop 监听器捕获并复制
    }

    document.addEventListener("dragenter", dragEnter);
    document.addEventListener("dragover", dragOver);
    document.addEventListener("dragleave", dragLeave);
    document.addEventListener("drop", drop);

    // 点击拖拽区域 = 选择文件 (工具栏已移除)
    dz.addEventListener("click", () => pickFiles());

    // 窗口获得焦点时静默刷新列表 (覆盖: 切窗回来、文件对话框/确认框关闭后)
    window.addEventListener("focus", () => loadList());

    async function init() {
        await loadList();
        loadBg();
    }

    async function loadBg() {
        try {
            const a = await api.assets();
            if (a && a.bg) $("bgimg").src = a.bg;
        } catch (e) {
            console.error(e);
        }
    }

    // 供 Python 侧调用: 添加文件完成后刷新
    window.__onFilesAdded = function (results) {
        const okCount = results.filter((r) => r.ok).length;
        const failCount = results.length - okCount;
        if (okCount > 0) {
            setMsg("已添加 " + okCount + " 个文件" + (failCount > 0 ? "，" + failCount + " 个被拒绝" : ""));
            if (failCount > 0) showToast(failCount + " 个文件不符合要求（仅支持 .bank / .carra2 / .rebank）", true);
            loadList();
        } else {
            setMsg(failCount > 0 ? "没有可添加的文件（仅支持 .bank / .carra2 / .rebank）" : "未添加任何文件", true);
        }
    };

    window.__onToggle = function (result) {
        if (result && result.error) {
            setMsg(result.error, true);
        } else {
            loadList();
        }
    };

    window.__onDelete = function (result) {
        if (result && result.error) {
            setMsg(result.error, true);
        } else {
            setMsg("已删除文件");
            loadList();
        }
    };

    function tryInitApi() {
        // api 对象在函数暴露前即为空对象 {}, 需确认目标函数已就绪再初始化 (避免竞态)
        if (window.pywebview && window.pywebview.api
                && typeof window.pywebview.api.get_data === 'function') {
            api = window.pywebview.api;
            init();
            return true;
        }
        setTimeout(tryInitApi, 70);
        return false;
    }

    window.addEventListener("pywebviewready", tryInitApi);
    tryInitApi();
</script>
</body>
</html>
