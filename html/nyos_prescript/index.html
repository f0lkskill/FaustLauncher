<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日指令</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    }

    body {
        background: radial-gradient(120% 90% at 50% 40%, #04060c 0%, #010102 100%);
    }

    #bgimg {
        position: fixed;
        inset: 0;
        margin: auto;
        width: min(46vw, 400px);
        opacity: 0.15;
        pointer-events: none;
        object-fit: contain;
        filter: drop-shadow(0 0 50px rgba(90, 160, 255, 0.22));
    }

    #prescript {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 60px 56px;
        cursor: pointer;
    }

    .line {
        font-family: "STKaiti", "KaiTi", "Microsoft YaHei", serif;
        font-size: 36px;
        line-height: 2.05;
        letter-spacing: 10px;
        text-indent: 10px;
        text-align: center;
        white-space: pre-wrap;
        word-break: break-all;
        max-width: 100%;
        color: #dbeaff;
        text-shadow: 0 0 6px rgba(255, 255, 255, 0.3), 0 0 22px rgba(140, 190, 255, 0.35);
    }

    .line .u {
        color: #9fc9ff;
        text-shadow: 0 0 8px rgba(130, 190, 255, 0.65), 0 0 22px rgba(110, 175, 255, 0.45);
    }

    .line .r {
        color: #f4fbff;
        text-shadow: 0 0 6px rgba(255, 255, 255, 0.9), 0 0 18px rgba(165, 215, 255, 0.8), 0 0 42px rgba(105, 175, 255, 0.55);
        animation: pop 0.22s ease;
    }

    @keyframes pop {
        0% { opacity: 0; transform: scale(0.4); filter: blur(2px); }
        100% { opacity: 1; transform: scale(1); filter: blur(0); }
    }

    .line .idle {
        color: #cfe3ff;
        opacity: 0.85;
    }

    .line.done:hover {
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.6), 0 0 30px rgba(170, 215, 255, 0.55);
    }

    .line.corrupting {
        filter: blur(3px);
        opacity: 0.5;
        transition: filter 0.22s ease, opacity 0.22s ease;
    }
</style>
</head>
<body>
<img id="bgimg" alt="">
<div id="prescript">
    <div class="line idle" id="line">今日指令</div>
</div>

<script>
    "use strict";

    const GARBLE_POOL = [
        "乱", "码", "佚", "隙", "烆", "箴", "蚣", "黅", "鬲", "魇",
        "ァ", "ュ", "ヲ", "ヰ", "ネ", "ム", "ﾊ", "ﾈ", "ﾑ", "ﾞ",
        "ǅ", "Ʊ", "Ⱥ", "Ϣ", "҂", "ઘ", "ঊ", "ಱ", "Ꭿ", "ᛟ",
        "Ⅷ", "⑂", "々", "〆", "ﾐ", "㌢", "⾴", "◍", "⩂", "ⳙ"
    ];

    const boxEl = document.getElementById("prescript");
    const lineEl = document.getElementById("line");
    const bgEl = document.getElementById("bgimg");

    let api = null;
    let busy = false;
    let sfx = null;
    let sfx2 = null;

    function garbledChar() {
        return GARBLE_POOL[Math.floor(Math.random() * GARBLE_POOL.length)];
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function corrupt(oldEls) {
        return new Promise(resolve => {
            let rounds = 7;
            const t = setInterval(() => {
                for (const s of oldEls) {
                    if (s.classList.contains("r")) s.textContent = garbledChar();
                }
                if (--rounds <= 0) {
                    clearInterval(t);
                    resolve();
                }
            }, 45);
        });
    }

    function playSfx() {
        if (!sfx) return;
        try {
            const a = new Audio(sfx);
            a.volume = 0.8;
            a.play().catch(() => {});
        } catch (e) {}
    }
    function playSfx2() {
        if (!sfx2) return;
        try {
            const a = new Audio(sfx2);
            a.volume = 0.7;
            a.play().catch(() => {});
        } catch (e) {}
    }

    async function loadAssets() {
        try {
            const a = await api.assets();
            if (a && a.bg) bgEl.src = a.bg;
            if (a && a.sfx) sfx = a.sfx;
            if (a && a.sfx2) sfx2 = a.sfx2;
        } catch (e) {
            console.error(e);
        }
    }

    async function fetchPrescript() {
        if (busy) return;
        busy = true;
        playSfx();
        playSfx2();

        try {
            if (!api) {
                lineEl.textContent = "请在启动器中打开";
                lineEl.className = "line";
                return;
            }
            const data = await api.generate();
            const chars = Array.from(data.final || "");
            const birth = Array.isArray(data.birth) ? data.birth : Array(chars.length).fill(0);

            const oldEls = Array.from(lineEl.querySelectorAll("span"));
            if (oldEls.length) {
                lineEl.classList.add("corrupting");
                await corrupt(oldEls);
                lineEl.classList.remove("corrupting");
            }

            const groups = new Map();
            for (let i = 0; i < birth.length; i++) {
                const b = birth[i] || 0;
                if (!groups.has(b)) groups.set(b, []);
                groups.get(b).push(i);
            }
            const order = [];
            Array.from(groups.keys()).sort((x, y) => x - y).forEach(b => {
                const arr = groups.get(b);
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                order.push(...arr);
            });

            lineEl.className = "line";
            lineEl.innerHTML = "";
            const els = [];
            for (let i = 0; i < chars.length; i++) {
                const s = document.createElement("span");
                s.className = "u";
                s.textContent = garbledChar();
                els.push(s);
                lineEl.appendChild(s);
            }

            const resolved = new Array(chars.length).fill(false);
            const flicker = setInterval(() => {
                for (let i = 0; i < chars.length; i++) {
                    if (!resolved[i] && chars[i] !== " ") els[i].textContent = garbledChar();
                }
            }, 70);

            const perChar = Math.max(60, Math.min(150, Math.floor(1800 / Math.max(chars.length, 1))));
            for (let k = 0; k < order.length; k++) {
                const i = order[k];
                els[i].textContent = chars[i];
                els[i].className = "r";
                resolved[i] = true;
                await sleep(perChar);
            }

            clearInterval(flicker);
            lineEl.classList.add("done");
            await sleep(800);
        } finally {
            busy = false;
        }
    }

    function tryInitApi() {
        if (window.pywebview && window.pywebview.api) {
            api = window.pywebview.api;
            loadAssets();
            return true;
        }
        setTimeout(tryInitApi, 70);
        return false;
    }

    window.addEventListener("pywebviewready", tryInitApi);
    tryInitApi();
    boxEl.addEventListener("click", fetchPrescript);
</script>

    function hook(){
        var api = window.pywebview && window.pywebview.api;
        if (!api || !api.generate || api.__genshinHooked) { setTimeout(hook, 200); return; }
        var _g = api.generate.bind(api);
        api.generate = function(){
            return _g().then(function(d){
                if (d && d.final && d.final.indexOf('原神') >= 0) {
                    try { fetch('http://127.0.0.1:' + PORT + '/genshin/launch'); } catch(e) {}
                }
                return d;
            });
        };
        api.__genshinHooked = true;
    }
    hook();

</body>
</html>
