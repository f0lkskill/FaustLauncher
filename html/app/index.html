<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FaustLauncher 浮士德启动器</title>
<link rel="stylesheet" href="css/style.css?v=81">
</head>
<body>
<div id="app-splash">
  <div class="splash-box">
    <div class="splash-spinner"></div>
  </div>
</div>
<div id="bg-layer"></div>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <img class="brand-icon" src="../../assets/images/icon/icon.png" alt="FaustLauncher" draggable="false">
      <div class="brand-text">
        <div class="brand-name">FaustLauncher</div>
        <div class="brand-sub">浮士德启动器</div>
      </div>
    </div>
    <nav id="nav">
      <button class="nav-item active" data-page="home"><span class="nav-ico">🏠</span><span>主页</span></button>
      <button class="nav-item" data-page="mod_addon"><span class="nav-ico">🧩</span><span>资源管理</span></button>
      <button class="nav-item" data-page="download_center"><span class="nav-ico">📦</span><span>下载中心</span></button>
      <button class="nav-item" data-page="tools"><span class="nav-ico">🔨</span><span>实用工具</span></button>
      <button class="nav-item" data-page="features"><span class="nav-ico">📃</span><span>快捷方式</span></button>
      <button class="nav-item" data-page="settings"><span class="nav-ico">⚙️</span><span>设置</span></button>
      <button class="nav-item" data-page="about"><span class="nav-ico">💻</span><span>关于</span></button>
    </nav>
  </aside>

  <main id="main">
    <!-- ==================== 主页 ==================== -->
    <section class="page active" id="page-home">
      <div class="hero card">
        <div class="hero-bg" id="hero-bg"></div>
        <div class="hero-content">
          <h1>您好，但丁</h1>
          <p class="hero-sub">让每一个但丁都解放双手，专心坐牢</p>
          <div class="hero-actions">
            <button class="btn btn-primary" id="btn-launch">
              <span class="btn-ico">🚀</span> 启动游戏
            </button>
            <button class="btn btn-success" id="btn-translate">🎯 汉化更新</button>
          </div>
          <div class="status-chips">
            <div class="chip chip-long" id="chip-gamepath"><span class="dot"></span><span>游戏路径: 未配置</span></div>
            <div class="chip" id="chip-source"><span class="dot"></span><span>下载源: -</span></div>
          </div>
        </div>
        <div class="hero-aside" aria-hidden="true">
          <img class="hero-bg-icon" src="../../assets/images/icon/icon.png" alt="">
          <div class="hero-clock">
            <div class="hc-date" id="hc-date">----年--月--日</div>
            <div class="hc-time" id="hc-time">--:--:--</div>
          </div>
        </div>
      </div>

      <div class="card" id="pipeline-card" hidden>
        <div class="pipe-body">
          <div class="pipe-left">
            <div class="pipe-steps" id="pipe-steps"></div>
          </div>
          <div class="pipe-detail">
            <div class="pipe-detail-ico" id="pipe-detail-ico">🔍</div>
            <div class="pipe-detail-text" id="pipe-detail-text">准备中...</div>
            <div class="pipe-detail-dl" id="pipe-detail-dl" hidden>
              <div class="progress-track pipe-dl-track"><div class="progress-fill" id="pipe-dl-fill"></div></div>
              <div class="pipe-dl-meta" id="pipe-dl-meta"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="grid-2">
        <div class="card stat-card stat-version-card loading" id="stat-version-card">
          <div class="stat-label">📌 当前版本</div>
          <div class="stat-value" id="stat-version">-</div>
          <div class="changelog-box" id="changelog-box">
            <div class="changelog-head">🕐 更新内容</div>
            <div class="changelog-body" id="changelog-body"><span class="changelog-empty">加载中...</span></div>
          </div>
          <div class="frame-spinner"><span></span></div>
        </div>
        <div class="card stat-card rec-card loading" id="rec-card">
          <div class="stat-label">🎲 随机推荐</div>
          <div class="rec-body" id="rec-body"></div>
          <div class="rec-foot" id="rec-foot"></div>
          <div class="frame-spinner"><span></span></div>
        </div>
      </div>
    </section>

    <!-- ==================== 快捷方式 ==================== -->
    <section class="page" id="page-features">
      <div class="carousel-3d" id="features-carousel">
        <div class="carousel-stage" id="features-stage"></div>
      </div>
      <div class="box-grid" id="features-grid" hidden></div>
      <div class="carousel-dots" id="features-dots"></div>
    </section>

    <!-- ==================== 工具 ==================== -->
    <section class="page" id="page-tools">
      <div class="carousel-3d" id="tools-carousel">
        <div class="carousel-stage" id="tools-stage"></div>
      </div>
      <div class="box-grid" id="tools-grid" hidden></div>
      <div class="carousel-dots" id="tools-dots"></div>
    </section>

    <!-- ==================== 资源管理 ==================== -->
    <section class="page" id="page-mod_addon">
      <div class="card">
        <div class="res-toolbar">
          <div class="res-tabs">
            <button class="res-tab active" data-kind="addon">🔌 插件</button>
            <button class="res-tab" data-kind="mod">🎮 Mod</button>
          </div>
          <input class="res-search" id="res-search" type="text" placeholder="🔍 搜索本地插件/Mod...">
          <div class="res-actions">
            <div class="res-actions-group" id="res-actions-addon">
              <button class="btn btn-ghost btn-icon" id="btn-open-addon-dir" title="打开插件目录">📂</button>
              <button class="btn btn-ghost btn-icon" id="btn-install-addon" title="安装插件 (zip)">➕</button>
            </div>
            <div class="res-actions-group" id="res-actions-mod" hidden>
              <button class="btn btn-ghost btn-icon" id="btn-open-mod-dir" title="打开 Mod 目录">📂</button>
              <button class="btn btn-ghost btn-icon" id="btn-open-mod-window" title="独立管理器（拖拽安装）">➕</button>
            </div>
          </div>
        </div>
        <div id="res-list" class="res-list"></div>
        <div id="res-pagination" class="res-pagination"></div>
      </div>
    </section>

    <!-- ==================== 下载中心 ==================== -->
    <section class="page" id="page-download_center">
      <div class="card">
        <div class="res-toolbar">
          <div class="res-tabs">
            <button class="res-tab active" data-dc="addon">🔌 插件</button>
            <button class="res-tab" data-dc="mod">🎮 Mod</button>
          </div>
          <input class="res-search" id="dc-search" type="text" placeholder="🔍 搜索云端插件/Mod...">
        </div>
        <div id="dc-list" class="res-list"></div>
        <div id="dc-pagination" class="res-pagination"></div>
        <div class="frame-spinner"><span></span></div>
      </div>
    </section>

    <!-- ==================== 设置 ==================== -->
    <section class="page" id="page-settings">
      <div id="settings-groups"></div>
      <div class="settings-actions">
        <button class="btn btn-ghost" id="btn-reset-settings">↺ 恢复默认</button>
      </div>
    </section>

    <!-- ==================== 关于 ==================== -->
    <section class="page" id="page-about">
      <div class="about-wrap">
        <div class="about-stage" id="about-stage">
          <div class="about-panel" id="about-panel-program"></div>
          <div class="about-panel" id="about-panel-contributors"></div>
        </div>
        <div class="carousel-dots" id="about-dots"></div>
      </div>
    </section>
  </main>

  <!-- ==================== 终端抽屉 ==================== -->
  <div id="terminal">
    <div class="term-head">
      <span>终端</span>
      <div class="term-actions">
        <button id="btn-copy-term">复制</button>
        <button id="btn-clear-term">清空</button>
      </div>
    </div>
    <div id="term-body"></div>
  </div>

<div id="toasts"></div>
  </div>

  <!-- ==================== 下载任务抽屉 ==================== -->
  <button class="dl-fab" id="dl-fab" title="下载任务">
    <span class="dl-fab-ico">📥</span>
  </button>
  <div class="dl-overlay" id="dl-overlay"></div>
  <aside class="dl-drawer" id="dl-drawer">
    <div class="dl-head">
      <span>📦 下载任务</span>
      <button class="dl-close" id="dl-close" title="关闭">✕</button>
    </div>
    <div class="dl-list" id="dl-list">
      <div class="dl-empty">暂无下载任务</div>
    </div>
  </aside>
<script src="js/app.js?v=88"></script>
<script>
/* 独立兜底: 完全不依赖 app.js。无论 app.js 是否崩溃, 只要内容加载完成或超时,
   就移除主页两张卡片的 loading 圆圈。 */
(function () {
  function kill(id) {
    var f = document.getElementById(id);
    if (!f) return;
    f.classList.remove('loading');
    var sp = f.querySelector('.frame-spinner');
    if (!sp) return;
    sp.style.opacity = '0';
    setTimeout(function () { sp.style.display = 'none'; }, 420);
  }
  // 内容感知: 各自卡片的内容不再是 "加载中" 才移除该卡片的圆圈 (互不影响)
  // 用 trim() 排除换行/空格等空白节点, 避免空卡片被误判为"已加载"
  setInterval(function () {
    var ch = document.getElementById('changelog-body');
    if (ch && ch.textContent.trim() && ch.textContent.indexOf('加载中') === -1) kill('stat-version-card');
    var rb = document.getElementById('rec-body');
    if (rb && rb.textContent.trim() && rb.textContent.indexOf('加载中') === -1) kill('rec-card');
  }, 500);
  // 硬超时: 仅当极端卡死(30秒)才移除, 避免破坏慢速加载的圆圈
  setTimeout(function () { kill('stat-version-card'); kill('rec-card'); }, 30000);
})();
</script>

<!-- 角色小人: 从右/下/上边缘随机探头摇摆, 全局显示 -->
<div id="character" aria-hidden="true">
  <img id="character-img" src="" alt="" draggable="false">
</div>
<!-- 角色问候语气泡: 弹入 -> 旋转坠落 -->
<div id="char-bubble" aria-hidden="true"></div>
</body>
</html>
