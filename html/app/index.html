<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FaustLauncher 浮士德启动器</title>
<link rel="stylesheet" href="css/style.css?v=109">
</head>
<body>
<div id="titlebar">
  <div class="tb-drag">
    <img class="tb-icon" src="assets/icon/icon.png" alt="" draggable="false">
    <span class="tb-title">FaustLauncher</span>
  </div>
  <div class="tb-actions">
    <button class="tb-btn" id="tb-min">&#x2212;</button>
    <button class="tb-btn tb-close" id="tb-close">&#x2715;</button>
  </div>
</div>
<div id="app-splash">
  <div class="splash-box">
    <div class="splash-spinner"></div>
  </div>
</div>
<div id="bg-layer"></div>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <img class="brand-icon" src="assets/icon/icon.png" alt="FaustLauncher" draggable="false">
      <div class="brand-text">
        <div class="brand-name">FaustLauncher</div>
        <div class="brand-sub">浮士德启动器</div>
      </div>
    </div>
    <nav id="nav">
      <button class="nav-item active" data-page="home"><span class="nav-ico"><svg class="ico" data-icon="all-application.svg" viewBox="0 0 48 48" fill="none" aria-hidden="true"></svg></span><span>主页</span></button>
      <button class="nav-item" data-page="mod_addon"><span class="nav-ico"><svg class="ico" data-icon="more-app.svg" viewBox="0 0 48 48" fill="none" aria-hidden="true"></svg></span><span>资源管理</span></button>
      <button class="nav-item" data-page="download_center"><span class="nav-ico"><svg class="ico" data-icon="download-two.svg" viewBox="0 0 48 48" fill="none" aria-hidden="true"></svg></span><span>下载中心</span></button>
      <button class="nav-item" data-page="tools"><span class="nav-ico"><svg class="ico" data-icon="tool.svg" viewBox="0 0 48 48" fill="none" aria-hidden="true"></svg></span><span>实用工具</span></button>
      <button class="nav-item" data-page="features"><span class="nav-ico"><svg class="ico" data-icon="bookmark.svg" viewBox="0 0 48 48" fill="none" aria-hidden="true"></svg></span><span>快捷方式</span></button>
      <button class="nav-item" data-page="settings"><span class="nav-ico"><svg class="ico" data-icon="setting-two.svg" viewBox="0 0 48 48" fill="none" aria-hidden="true"></svg></span><span>设置</span></button>
      <button class="nav-item" data-page="about"><span class="nav-ico"><svg class="ico" data-icon="code.svg" viewBox="0 0 48 48" fill="none" aria-hidden="true"></svg></span><span>关于</span></button>
    </nav>
  </aside>

  <main id="main">
    <!-- ==================== 主页 ==================== -->
    <section class="page active" id="page-home">
      <div class="hero card">
        <div class="hero-bg" id="hero-bg"></div>
        <div class="hero-content">
          <h1>您好，<span id="hero-user">但丁</span></h1>
          <p class="hero-sub">让每一个但丁都解放双手，专心坐牢</p>
          <div class="hero-actions">
            <button class="btn btn-primary" id="btn-launch">
              <span class="btn-ico"><svg class="ico" data-icon="power.svg" viewBox="0 0 48 48" fill="none" aria-hidden="true"></svg></span> 启动游戏
            </button>
            <button class="btn btn-success" id="btn-translate"><svg class="ico" data-icon="translate.svg" viewBox="0 0 48 48" fill="none" aria-hidden="true"></svg> 汉化更新</button>
          </div>
          <div class="status-chips">
            <div class="chip chip-long" id="chip-gamepath"><span class="dot"></span><span>游戏路径: 未配置</span></div>
            <div class="chip" id="chip-source"><span class="dot"></span><span>下载源: -</span></div>
          </div>
        </div>
        <div class="hero-aside" aria-hidden="true">
          <img class="hero-bg-icon" src="assets/icon/icon.png" alt="">
          <div class="hero-clock">
            <div class="hc-date" id="hc-date">----年--月--日</div>
            <div class="hc-time" id="hc-time">--:--:--</div>
          </div>
        </div>
      </div>

    <div class="card" id="pipeline-card" hidden>
        <div class="pipe-body">
          <div class="pipe-left">
            <div class="pipe-steps" id="pipe-steps"></div>
          </div>
          <div class="pipe-detail">
            <div class="pipe-detail-ico" id="pipe-detail-ico"><svg class="ico" data-icon="search.svg" viewBox="0 0 48 48" fill="none" aria-hidden="true"></svg></div>
            <div class="pipe-detail-text" id="pipe-detail-text">准备中...</div>
            <div class="pipe-detail-dl" id="pipe-detail-dl" hidden>
              <div class="progress-track pipe-dl-track"><div class="progress-fill" id="pipe-dl-fill"></div></div>
              <div class="pipe-dl-meta" id="pipe-dl-meta"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="grid-2">
        <div class="card stat-card stat-version-card loading" id="stat-version-card">
          <div class="stat-label"><svg class="ico" data-icon="bookmark-one.svg" viewBox="0 0 48 48" fill="none" aria-hidden="true"></svg> 当前版本</div>
          <div class="stat-value" id="stat-version">-</div>
          <div class="changelog-box" id="changelog-box">
            <div class="changelog-head"><svg class="ico" data-icon="write.svg" viewBox="0 0 48 48" fill="none" aria-hidden="true"></svg> 更新内容</div>
            <div class="changelog-body" id="changelog-body"><span class="changelog-empty">加载中...</span></div>
          </div>
          <div class="frame-spinner"><span></span></div>
        </div>
        <div class="card stat-card rec-card loading" id="rec-card">
          <div class="stat-label"><svg class="ico" data-icon="like.svg" viewBox="0 0 48 48" fill="none" aria-hidden="true"></svg> 随机推荐</div>
          <div class="rec-body" id="rec-body"></div>
          <div class="rec-foot" id="rec-foot"></div>
          <div class="frame-spinner"><span></span></div>
        </div>
      </div>
    </section>

    <!-- ==================== 快捷方式 ==================== -->
    <section class="page" id="page-features">
      <div class="carousel-3d" id="features-carousel">
        <div class="carousel-stage" id="features-stage"></div>
      </div>
      <div class="box-grid" id="features-grid" hidden></div>
      <div class="carousel-dots" id="features-dots"></div>
    </section>

    <!-- ==================== 工具 ==================== -->
    <section class="page" id="page-tools">
      <div class="carousel-3d" id="tools-carousel">
        <div class="carousel-stage" id="tools-stage"></div>
      </div>
      <div class="box-grid" id="tools-grid" hidden></div>
      <div class="carousel-dots" id="tools-dots"></div>
    </section>

    <!-- ==================== 资源管理 ==================== -->
    <section class="page" id="page-mod_addon">
      <div class="card">
        <div class="res-toolbar">
          <div class="res-tabs">
            <button class="res-tab active" data-kind="addon"><svg class="ico" data-icon="bolt-one.svg" viewBox="0 0 48 48" fill="none" aria-hidden="true"></svg> 插件</button>
            <button class="res-tab" data-kind="mod"><svg class="ico" data-icon="more-app.svg" viewBox="0 0 48 48" fill="none" aria-hidden="true"></svg> Mod</button>
          </div>
          <div class="res-search-wrap">
            <svg class="ico res-search-ico" data-icon="search.svg" viewBox="0 0 48 48" fill="none" aria-hidden="true"></svg>
            <input class="res-search" id="res-search" type="text" placeholder="搜索本地插件/Mod...">
          </div>
          <div class="res-actions">
            <div class="res-actions-group" id="res-actions-addon">
              <button class="btn btn-ghost btn-icon" id="btn-open-addon-dir" title="打开插件目录"><svg class="ico" data-icon="all-application.svg" viewBox="0 0 48 48" fill="none" aria-hidden="true"></svg></button>
              <button class="btn btn-ghost btn-icon" id="btn-install-addon" title="安装插件 (zip)"><svg class="ico" data-icon="install.svg" viewBox="0 0 48 48" fill="none" aria-hidden="true"></svg></button>
              <button class="btn btn-ghost btn-icon" id="btn-reinstall-addon" title="重装所有可匹配插件"><svg class="ico" data-icon="refresh.svg" viewBox="0 0 48 48" fill="none" aria-hidden="true"></svg></button>
            </div>
            <div class="res-actions-group" id="res-actions-mod" hidden>
              <button class="btn btn-ghost btn-icon" id="btn-open-mod-dir" title="打开 Mod 目录"><svg class="ico" data-icon="all-application.svg" viewBox="0 0 48 48" fill="none" aria-hidden="true"></svg></button>
              <button class="btn btn-ghost btn-icon" id="btn-open-mod-window" title="独立管理器（拖拽安装）"><svg class="ico" data-icon="file-addition-one.svg" viewBox="0 0 48 48" fill="none" aria-hidden="true"></svg></button>
              <button class="btn btn-ghost btn-icon" id="btn-reinstall-mod" title="重装所有可匹配 Mod"><svg class="ico" data-icon="refresh.svg" viewBox="0 0 48 48" fill="none" aria-hidden="true"></svg></button>
            </div>
          </div>
        </div>
        <div id="res-list" class="res-list"></div>
        <div id="res-pagination" class="res-pagination"></div>
        <!-- 进入本页时清空列表后的转圈遮罩(与下载中心一致) -->
        <div class="frame-spinner"><span></span></div>
      </div>
    </section>

    <!-- ==================== 下载中心 ==================== -->
    <section class="page" id="page-download_center">
      <div class="card">
        <div class="res-toolbar">
          <div class="res-tabs">
            <button class="res-tab active" data-dc="addon"><svg class="ico" data-icon="bolt-one.svg" viewBox="0 0 48 48" fill="none" aria-hidden="true"></svg> 插件</button>
            <button class="res-tab" data-dc="mod"><svg class="ico" data-icon="more-app.svg" viewBox="0 0 48 48" fill="none" aria-hidden="true"></svg> Mod</button>
          </div>
          <div class="res-search-wrap">
            <svg class="ico res-search-ico" data-icon="search.svg" viewBox="0 0 48 48" fill="none" aria-hidden="true"></svg>
            <input class="res-search" id="dc-search" type="text" placeholder="搜索云端插件/Mod...">
          </div>
          <button class="btn btn-ghost btn-icon" id="dc-refresh" title="忽略本次启动的缓存, 重新从云端获取列表"><svg class="ico" data-icon="refresh.svg" viewBox="0 0 48 48" fill="none" aria-hidden="true"></svg></button>
        </div>
        <div id="dc-list" class="res-list"></div>
        <div id="dc-pagination" class="res-pagination"></div>
        <div class="frame-spinner"><span></span></div>
      </div>
    </section>

    <!-- ==================== 设置 ==================== -->
    <section class="page" id="page-settings">
      <div id="settings-groups"></div>
      <div class="settings-actions">
      </div>
    </section>

    <!-- ==================== 关于 ==================== -->
    <section class="page" id="page-about">
      <div class="about-wrap">
        <div class="about-stage" id="about-stage">
          <div class="about-panel" id="about-panel-program"></div>
          <div class="about-panel" id="about-panel-contributors"></div>
        </div>
        <div class="carousel-dots" id="about-dots"></div>
      </div>
    </section>
  </main>

  <!-- ==================== 终端抽屉 ==================== -->
  <div id="terminal">
    <div class="term-head">
      <span>终端</span>
      <div class="term-actions">
        <button id="btn-copy-term">复制</button>
        <button id="btn-clear-term">清空</button>
      </div>
    </div>
    <div id="term-body"></div>
  </div>

<div id="toasts"></div>
  </div>

  <!-- ==================== 下载任务抽屉 ==================== -->
  <button class="dl-fab" id="dl-fab" title="下载任务">
    <span class="dl-fab-ico"><svg class="ico" data-icon="download-two.svg" viewBox="0 0 48 48" fill="none" aria-hidden="true"></svg></span>
  </button>
  <div class="dl-overlay" id="dl-overlay"></div>
  <aside class="dl-drawer" id="dl-drawer">
    <div class="dl-head">
      <span><svg class="ico" data-icon="download-two.svg" viewBox="0 0 48 48" fill="none" aria-hidden="true"></svg> 下载任务</span>
      <button class="dl-close" id="dl-close" title="关闭"><svg class="ico" data-icon="close.svg" viewBox="0 0 48 48" fill="none" aria-hidden="true"></svg></button>
    </div>
    <div class="dl-list" id="dl-list">
      <div class="dl-empty">暂无下载任务</div>
    </div>
  </aside>
<!-- ============================================================
     前端脚本按功能拆分, 加载顺序固定为: core(基座) → ui(界面件) → features(业务) → app.js(入口)
     注意: 所有文件共享同一个全局作用域(顶层函数/变量即全局 API, 便于插件扩展调用),
           因此 1) 顺序不能随意调整  2) 重名声明会直接报错  3) 新增模块请追加到末尾(入口之前)。
     各文件职责见文件头注释; 总览见 js/app.js 顶部。
     ============================================================ -->
<!-- core: 基座层(环境/状态/工具/后端通道/外壳) -->
<script src="js/core/bootstrap.js?v=109"></script>
<script src="js/core/state.js?v=109"></script>
<script src="js/core/utils.js?v=109"></script>
<!-- 图标仓库: 内联 SVG (assets/icon/*.svg), 取代此前的 emoji 图标 -->
<script src="js/core/icons.js?v=109"></script>
<script src="js/core/bridge.js?v=109"></script>
<script src="js/core/events.js?v=109"></script>
<!-- ui: 通用界面件(外观/反馈/装饰) -->
<script src="js/ui/theme.js?v=109"></script>
<script src="js/ui/sound.js?v=109"></script>
<script src="js/ui/frame_loading.js?v=109"></script>
<script src="js/ui/terminal.js?v=109"></script>
<script src="js/ui/tilt.js?v=109"></script>
<script src="js/ui/background.js?v=109"></script>
<script src="js/ui/character.js?v=109"></script>
<script src="js/ui/carousel.js?v=109"></script>
<script src="js/ui/version_modal.js?v=109"></script>
<!-- features: 业务功能(流水线/资源/下载/工具/主页/设置/关于) -->
<script src="js/features/pipeline.js?v=109"></script>
<script src="js/features/resources.js?v=109"></script>
<script src="js/features/downloads.js?v=109"></script>
<script src="js/features/tools.js?v=109"></script>
<script src="js/features/home.js?v=109"></script>
<script src="js/features/settings.js?v=109"></script>
<script src="js/features/about.js?v=109"></script>
<!-- 入口: 启动流程 + 对外插件 API (必须最后) -->
<script src="js/app.js?v=109"></script>
<script>
/* 独立兜底: 完全不依赖 app.js。无论 app.js 是否崩溃, 只要内容加载完成或超时,
   就移除主页两张卡片的 loading 圆圈。 */
(function () {
  function kill(id) {
    var f = document.getElementById(id);
    if (!f) return;
    f.classList.remove('loading');
    var sp = f.querySelector('.frame-spinner');
    if (!sp) return;
    sp.style.opacity = '0';
    setTimeout(function () { sp.style.display = 'none'; }, 420);
  }
  // 内容感知: 各自卡片的内容不再是 "加载中" 才移除该卡片的圆圈 (互不影响)
  // 用 trim() 排除换行/空格等空白节点, 避免空卡片被误判为"已加载"
  setInterval(function () {
    var ch = document.getElementById('changelog-body');
    if (ch && ch.textContent.trim() && ch.textContent.indexOf('加载中') === -1) kill('stat-version-card');
    var rb = document.getElementById('rec-body');
    if (rb && rb.textContent.trim() && rb.textContent.indexOf('加载中') === -1) kill('rec-card');
  }, 500);
  // 硬超时: 仅当极端卡死(30秒)才移除, 避免破坏慢速加载的圆圈
  setTimeout(function () { kill('stat-version-card'); kill('rec-card'); }, 30000);
})();
</script>

<!-- 角色小人: 从右/下/上边缘随机探头摇摆, 全局显示 -->
<div id="character" aria-hidden="true">
  <img id="character-img" src="" alt="" draggable="false">
</div>
<!-- 角色问候语气泡: 弹入 -> 旋转坠落 -->
<div id="char-bubble" aria-hidden="true"></div>
</body>
</html>
