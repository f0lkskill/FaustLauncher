<script>
/* 独立兜底: 完全不依赖 app.js。无论 app.js 是否崩溃, 只要内容加载完成或超时,
   就移除主页两张卡片的 loading 圆圈。 */
(function () {
  function kill(id) {
    var f = document.getElementById(id);
    if (!f) return;
    f.classList.remove('loading');
    var sp = f.querySelector('.frame-spinner');
    if (!sp) return;
    sp.style.opacity = '0';
    setTimeout(function () { sp.style.display = 'none'; }, 420);
  }
  // 内容感知: 各自卡片的内容不再是 "加载中" 才移除该卡片的圆圈 (互不影响)
  // 用 trim() 排除换行/空格等空白节点, 避免空卡片被误判为"已加载"
  setInterval(function () {
    var ch = document.getElementById('changelog-body');
    if (ch && ch.textContent.trim() && ch.textContent.indexOf('加载中') === -1) kill('stat-version-card');
    var rb = document.getElementById('rec-body');
    if (rb && rb.textContent.trim() && rb.textContent.indexOf('加载中') === -1) kill('rec-card');
  }, 500);
  // 硬超时: 仅当极端卡死(30秒)才移除, 避免破坏慢速加载的圆圈
  setTimeout(function () { kill('stat-version-card'); kill('rec-card'); }, 30000);
})();
</script>
