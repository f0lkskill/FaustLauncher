<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YisangMirrorFlow</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wf-app">

  <header class="wf-head">
    <div class="wf-brand">
      <div class="wf-mark" id="wf-mark">
        <img id="wf-icon" alt="">
        <span id="wf-mark-letter">Y</span>
      </div>
      <div class="wf-brand-text">
        <h1>YisangMirrorFlow</h1>
        <p id="wf-version">Mod 打包工作流</p>
      </div>
    </div>
  </header>

  <div class="wf-body">
    <section class="wf-page show" id="page-workflow">
      <div class="wf-workflow">
        <section class="wf-config">
          <div class="wf-field">
            <label for="wf-game-path">游戏目录</label>
            <input id="wf-game-path" type="text" readonly placeholder="尚未设置，.bank 需要对照原版 bank">
            <button class="wf-btn" id="wf-pick-game">选择目录</button>
            <span class="wf-state" id="wf-sound-state"></span>
          </div>
          <div class="wf-field small">
            <label for="wf-threads">线程</label>
            <input id="wf-threads" type="number" min="1" max="10" step="1" value="5">
          </div>
        </section>

        <main class="wf-main">
          <div class="wf-list-head">
            <span>打包队列</span>
            <span class="wf-badge" id="wf-count">0</span>
            <span class="wf-spacer"></span>
            <button class="wf-btn" id="wf-open-mods">打开包目录</button>
            <button class="wf-btn primary" id="wf-new">新建包</button>
            <button class="wf-btn ghost" id="wf-refresh">刷新</button>
          </div>
          <div class="wf-list" id="wf-list"></div>
        </main>
      </div>
    </section>
  </div>
</div>

<!-- 新建包：选择类型 -->
<div class="wf-modal" id="wf-modal" hidden>
  <div class="wf-dialog">
    <h2>新建包</h2>
    <p>包名会作为 mods 下的文件夹名。</p>
    <input id="wf-new-name" type="text" maxlength="60" placeholder="例如：镜像人格-音效">
    <div class="wf-kind-row" id="wf-kind-row">
      <button type="button" class="wf-kind active" data-kind="mod" title="需要打包 zip/bank">Mod 包</button>
      <button type="button" class="wf-kind" data-kind="addon" title="自带 scr.py，免打包，可直接发布">插件包</button>
    </div>
    <div class="wf-dialog-actions">
      <button class="wf-btn ghost" id="wf-new-cancel">取消</button>
      <button class="wf-btn primary" id="wf-new-confirm">创建</button>
    </div>
  </div>
</div>

<!-- 包信息（先手动包装再发布） -->
<div class="wf-modal" id="infoModal" hidden>
  <div class="info-card">
    <div class="info-head">
      <span id="info-title">包信息</span>
      <button class="info-x" id="info-close" type="button">✕</button>
    </div>
    <div class="info-body">
      <div class="info-toprow">
        <button class="icon-add" id="info-icon" type="button" title="选择图标">
          <img id="info-icon-img" alt="" hidden>
          <span id="info-icon-plus">+</span>
        </button>
        <input id="info-name" type="text" placeholder="名称">
      </div>
      <div class="info-field">
        <label>描述</label>
        <textarea id="info-desc" rows="3" placeholder="Mod / 插件功能说明..."></textarea>
      </div>
      <div class="info-field">
        <label>版本号</label>
        <input id="info-version" type="text" placeholder="0.0.1">
      </div>
      <div class="info-field">
        <label>作者</label>
        <div id="info-authors" class="author-list"></div>
        <button class="btn-add-author" id="info-add-author" type="button">+ 添加作者</button>
      </div>
      <div class="info-hint" id="info-hint"></div>
    </div>
    <div class="info-foot">
      <button class="wf-btn ghost" id="info-cancel" type="button">取消</button>
      <button class="wf-btn primary" id="info-save" type="button">保存</button>
    </div>
  </div>
</div>

<!-- 添加作者 -->
<div class="wf-modal" id="authorModal" hidden>
  <div class="author-card">
    <div class="info-head">
      <span>添加作者</span>
      <button class="info-x" id="author-close" type="button">✕</button>
    </div>
    <div class="info-body">
      <div class="info-field"><label>名字</label><input id="author-name" type="text" placeholder="作者名"></div>
      <div class="info-field"><label>链接（可选）</label><input id="author-link" type="text" placeholder="https://..."></div>
    </div>
    <div class="info-foot">
      <button class="wf-btn ghost" id="author-cancel" type="button">取消</button>
      <button class="wf-btn primary" id="author-add" type="button">添加</button>
    </div>
  </div>
</div>

<!-- 发布日志（可最小化到右下角浮标） -->
<div class="wf-modal" id="logModal" hidden>
  <div class="log-card">
    <div class="info-head">
      <span id="log-title">发布日志</span>
      <span class="log-actions">
        <button class="info-x" id="log-min" type="button" title="最小化">—</button>
        <button class="info-x" id="log-close" type="button" title="关闭">✕</button>
      </span>
    </div>
    <div class="log-progress"><div class="log-progress-fill" id="log-fill"></div></div>
    <div class="log-status" id="log-status">准备中...</div>
    <div class="log-text" id="log-text"></div>
  </div>
</div>
<div class="log-float" id="logFloat" hidden>
  <span class="log-float-dot"></span>
  <span class="log-float-text" id="log-float-text">发布中...</span>
  <button class="log-float-open" id="log-float-open" type="button" title="查看详情">⤢</button>
</div>

<div class="wf-toast" id="wf-toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
