name: 检查汉化更新包

on:
  # 手动触发
  workflow_dispatch:
  # 每天 2 次 (UTC 00:00 / 12:00 = 北京时间 08:00 / 20:00)
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'

# 同一时间只允许一个检查任务运行, 避免定时触发与手动触发并发写笔记
concurrency:
  group: check-newest-package
  cancel-in-progress: false

jobs:
  check-and-run:
    name: 检查并同步零协会汉化
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # 下载 / 上传可能因网络静默 hang；即使请求层漏了超时，也由 job 硬兜底，
    # 避免一个卡住的运行占住 concurrency 组、把后续所有定时运行全部堵在队列里。
    timeout-minutes: 20

    # runner 默认是 UTC, 而笔记里的时间戳按北京时间写入/比较, 所以固定时区。
    # 用 TZ 环境变量而不是第三方 action (Python 的 datetime.now() 会读 TZ)。
    # PYTHONUNBUFFERED 让 print 实时写进 Actions 日志，否则 stdout 块缓冲会让
    # 卡住的位置看起来像停在第一行警告上，没法定位。
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          # 不用 3.9: 新版 Ubuntu runner 已不再提供该版本, 会直接找不到解释器
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 版本判断统一交给 UpdatePackage.py (唯一持有持久状态的一方):
      # 它比对零协会最新 release 与笔记里的 llc_version, 需要更新或镜像该刷新时才
      # 下载 / 上传 / 写笔记, 都没有变化时直接返回。
      - name: 执行更新检查
        env:
          ADDRESS: ${{ secrets.WEBNOTE_ADDRESS }}
          # 使用内置 token 调用 GitHub API, 避免共享 runner 的未认证请求被限流
          GH_TOKEN: ${{ github.token }}
          # 蓝奏云上传凭据 (浏览器登录 pan.lanzou.com 后 F12 复制 cookie, 过期需更新)
          LANZOU_YLOGIN: ${{ secrets.LANZOU_YLOGIN }}
          LANZOU_YLOGINS: ${{ secrets.LANZOU_YLOGINS }}
          LANZOU_PHPDISK_INFO: ${{ secrets.LANZOU_PHPDISK_INFO }}
        run: python .github/UpdatePackage.py