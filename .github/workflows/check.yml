name: Check Newest Package

# 正确配置：无 branches，无跨仓库错误
on:
  # 手动触发（保留）
  workflow_dispatch:
  # 每天 2 次检查（极低频率，绝对安全，不会触发限流）
  schedule:
    - cron: '0 0 * * *'   # UTC 00:00 = 北京时间 08:00
    - cron: '0 12 * * *'  # UTC 12:00 = 北京时间 20:00

jobs:
  check-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Set timezone to Beijing
        uses: szenius/set-timezone@v1.2
        with:
          timezoneLinux: "Asia/Shanghai"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      # 版本判断统一交给 UpdatePackage.py —— 它是唯一持有持久状态的一方:
      #   · 云端笔记 (textdb.online) 是唯一能跨次运行保存的版本状态;
      #   · 脚本比对 "OurPlay 版本 / LLC 版本 / LLC 镜像是否需要刷新",
      #     三者都无需更新时会直接 return, 既不更新笔记也不重新上传文件。
      #
      # 为什么删掉了原先的 .last_release_tag 门槛:
      #   1) CI 每次都是全新 checkout, 该缓存文件从未提交或回写仓库 (permissions 也是只读),
      #      所以每次读取到的 last 都是空串, `latest != last` 恒成立 —— 门槛形同虚设,
      #      每次运行都会执行上传流程;
      #   2) 它只比对 LLC 的 release, 会漏掉 OurPlay 更新与 LLC 镜像刷新,
      #      即使修好持久化也会在不该跳过的时候跳过。
      - name: Run update package (版本无变化时不会更新笔记/上传文件)
        env:
          ADDRESS: ${{ secrets.WEBNOTE_ADDRESS }}
          # 蓝奏云上传凭据（浏览器登录 pan.lanzou.com 后 F12 复制 cookie，过期需更新）
          LANZOU_YLOGIN: ${{ secrets.LANZOU_YLOGIN }}
          LANZOU_YLOGINS: ${{ secrets.LANZOU_YLOGINS }}
          LANZOU_PHPDISK_INFO: ${{ secrets.LANZOU_PHPDISK_INFO }}
        run: python .github/UpdatePackage.py
