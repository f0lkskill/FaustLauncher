name: Check Newest Package

on:
  # 手动触发
  workflow_dispatch:
  # 每天 2 次 (UTC 00:00 / 12:00 = 北京时间 08:00 / 20:00)
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'

jobs:
  check-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # runner 默认是 UTC, 而笔记里的时间戳按北京时间写入/比较, 所以固定时区。
    # 用 TZ 环境变量而不是第三方 action (Python 的 datetime.now() 会读 TZ)。
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 版本判断统一交给 UpdatePackage.py (唯一持有持久状态的一方):
      # 它比对零协会最新 release 与笔记里的 llc_version, 需要更新或镜像该刷新时才
      # 下载 / 上传 / 写笔记, 都没有变化时直接返回。
      - name: Run update check
        env:
          ADDRESS: ${{ secrets.WEBNOTE_ADDRESS }}
          # 蓝奏云上传凭据 (浏览器登录 pan.lanzou.com 后 F12 复制 cookie, 过期需更新)
          LANZOU_YLOGIN: ${{ secrets.LANZOU_YLOGIN }}
          LANZOU_YLOGINS: ${{ secrets.LANZOU_YLOGINS }}
          LANZOU_PHPDISK_INFO: ${{ secrets.LANZOU_PHPDISK_INFO }}
        run: python .github/UpdatePackage.py
