name: Check Newest Package

# 正确配置：无 branches，无跨仓库错误
on:
  # 手动触发（保留）
  workflow_dispatch:
  # 每天 2 次检查（极低频率，绝对安全，不会触发限流）
  schedule:
    - cron: '0 0 * * *'   # UTC 00:00 = 北京时间 08:00
    - cron: '0 12 * * *'  # UTC 12:00 = 北京时间 20:00

jobs:
  check-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      
    steps:
      - name: Set timezone to Beijing
        uses: szenius/set-timezone@v1.2
        with:
          timezoneLinux: "Asia/Shanghai"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      # 核心：安全检查新版本 + 有更新才运行脚本
      - name: Check latest release and run script
        env:
          ADDRESS: ${{ secrets.WEBNOTE_ADDRESS }}
          TARGET_REPO: LocalizeLimbusCompany/LocalizeLimbusCompany
          # 蓝奏云上传凭据（浏览器登录 pan.lanzou.com 后 F12 复制 cookie，过期需更新）
          LANZOU_YLOGIN: ${{ secrets.LANZOU_YLOGIN }}
          LANZOU_YLOGINS: ${{ secrets.LANZOU_YLOGINS }}
          LANZOU_PHPDISK_INFO: ${{ secrets.LANZOU_PHPDISK_INFO }}
        run: |
          python << 'PYTHON_CODE'
          import os
          import requests

          # 配置
          repo = os.getenv("TARGET_REPO")
          cache_file = ".last_release_tag"

          # 获取最新 Release（匿名访问，官方允许，极低频率）
          try:
              res = requests.get(f"https://api.github.com/repos/{repo}/releases/latest", timeout=10)
              res.raise_for_status()
              latest = res.json()["tag_name"]
          except Exception as e:
              print("请求失败：", e)
              exit(0)

          # 读取上一次记录
          try:
              with open(cache_file, "r", encoding="utf-8") as f:
                  last = f.read().strip()
          except:
              last = ""

          print(f"最新版本: {latest}")
          print(f"已记录版本: {last}")

          # 版本不一样 = 有更新
          if latest != last:
              print("✅ 发现新版本，开始执行脚本...")
              
              # 保存新版本号
              with open(cache_file, "w", encoding="utf-8") as f:
                  f.write(latest)
              
              # 运行你的两个脚本
              os.system("python .github/UpdatePackage.py")
              # os.system("python .github/UpdatePackage_LCTA.py")
          else:
              print("✅ 暂无新版本，无需运行")
          PYTHON_CODE
