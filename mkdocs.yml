site_name: FaustLauncher 插件开发文档
site_description: 基于 WarpHook 的插件二次开发：从空插件到读取全场对象与 buff
site_url: https://f0lkskill.github.io/FaustLauncher/
repo_url: https://github.com/f0lkskill/FaustLauncher
repo_name: f0lkskill/FaustLauncher
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: 切到深色
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: 切到浅色
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist

plugins:
  - search:
      lang:
        - zh
        - en

extra:
  generator: false

nav:
  - 首页: index.md
  - 入门教程:
      - tutorial/index.md
      - 01 第一个插件: tutorial/01-hello.md
      - 02 让游戏弹一句话: tutorial/02-popup.md
      - 03 事情发生时通知我: tutorial/03-events.md
      - 04 读一个单位: tutorial/04-unit.md
      - 05 把属性都拿出来: tutorial/05-props.md
      - 06 解析 buff: tutorial/06-buffs.md
      - 07 生命周期与线程: tutorial/07-lifecycle.md
      - 08 想到底层去: tutorial/08-inside.md
  - 技术文档:
      - technical/index.md
      - 01 命名空间: technical/01-namespaces.md
      - 02 warp.game: technical/02-game.md
      - 03 warp.object: technical/03-object.md
      - 04 warp.field: technical/04-field.md
      - 05 warp.plugin: technical/05-plugin.md
      - 06 底层四件套: technical/06-lowlevel.md
  - 参考手册:
      - reference/game-memory.md
      - reference/dev-notes.md
  - 归档:
      - archive/session-selfcheck.md
